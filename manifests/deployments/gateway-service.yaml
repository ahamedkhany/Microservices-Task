apiVersion: apps/v1
kind: Deployment

metadata:
  name: gateway-service

  labels:
    app: gateway-service

spec:

  replicas: 2

  selector:
    matchLabels:
      app: gateway-service

  template:

    metadata:
      labels:
        app: gateway-service

    spec:

      containers:

      - name: gateway-service

        image: gateway-service:latest
        imagePullPolicy: IfNotPresent

        ports:
        - containerPort: 3003

        env:
        - name: NODE_ENV
          value: "production"

        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"

          limits:
            cpu: "250m"
            memory: "256Mi"

        readinessProbe:
          httpGet:
            path: /health
            port: 3003
          initialDelaySeconds: 5
          periodSeconds: 10

        livenessProbe:
          httpGet:
            path: /health
            port: 3003
          initialDelaySeconds: 15
          periodSeconds: 20