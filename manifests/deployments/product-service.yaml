apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service
  labels:
    app: product-service

spec:
  replicas: 2

  selector:
    matchLabels:
      app: product-service

  template:
    metadata:
      labels:
        app: product-service

    spec:
      containers:

      - name: product-service
        image: product-service:latest
        imagePullPolicy: IfNotPresent

        ports:
        - containerPort: 3001

        env:
        - name: NODE_ENV
          value: "production"

        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"

          limits:
            cpu: "250m"
            memory: "256Mi"

        readinessProbe:
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: 5
          periodSeconds: 10

        livenessProbe:
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: 15
          periodSeconds: 20